name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Windows PowerShell 5.1 and PowerShell 7
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run deterministic tests
        shell: powershell
        run: .\tests\Run-Tests.ps1
      - name: Run live loopback tests
        shell: powershell
        run: .\tests\Run-Tests.ps1 -Live
      - name: Run PowerShell 7 deterministic tests
        shell: pwsh
        run: .\tests\Run-Tests.ps1
      - name: Run PowerShell 7 live loopback tests
        shell: pwsh
        run: .\tests\Run-Tests.ps1 -Live
